<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-Up Form</title>
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div class="signup-left">
        <div class="logo">
            <div class="logo-img">
                <img src="" alt="logo">
            </div>
            <div class="logo-text">
                <h1>ODIN</h1>
            </div>
        </div>
        <div class="img-credits">
            <p>Photo by <a href="https://unsplash.com/@maks_sobo?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Sobolev Maksim</a> on <a href="https://unsplash.com/photos/circular-star-trails-against-a-dark-blue-sky-pCvnMf2Cb4A?utm_source=unsplash&utm_medium=referral&utm_content=creditCopyText">Unsplash</a></p>
        </div>
    </div>
    <div class="signup-right">
        <pre>This is not a real online service!You know you need something
            like this in your life to realise your deepest dreams.
            Signup <i>now</i> to get started.

            You <i>know</i> you want to.
        </pre>
        <div class="signup-form">
            <h3>Let's do this</h3>
            <form>
                <div class="form-cols">
                    <div class="form-left">
                        <label for="firstname">FIRST NAME</label>
                        <input id="firstname" type="text">
                        <label for="emailid">EMAIL</label>
                        <input id="emailid" type="email">
                        <label for="passwd">PASSWORD</label>
                        <input id="passwd" type="password">
                    </div>
                    <div class="form-right">
                        <label for="lastname">LAST NAME</label>
                        <input id="lastname" type="text">
                        <label for="phoneno">PHONE NUMBER</label>
                        <input id="phoneno" type="number">
                        <label for="confpasswd">CONFIRM PASSWORD</label>
                        <input id="confpasswd" type="password">
                    </div>
                </div>
        </div>
        <button type="submit">Create Account</button>
            </form> 
        <p>Already have an account?<span>Log In</span></p>
    </div>
</body>
</html>
